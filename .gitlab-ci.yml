image: python:3.13

stages:
  - test
  - security
  - build

variables:
  POETRY_VERSION: "2.3.1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python --version
  - pip install poetry==$POETRY_VERSION
  - poetry config virtualenvs.create true
  - poetry config virtualenvs.in-project true
  - |
    @'
    DATABASE__HOST=localhost
    DATABASE__PORT=5432
    DATABASE__USER=test_user
    DATABASE__PASSWORD=test_password
    DATABASE__DB=test_db

    DERIBIT_API__CLIENT_ID=test_client_id
    DERIBIT_API__CLIENT_SECRET=test_client_secret

    REDIS__HOST=localhost
    REDIS__PORT=6379
    REDIS__DB=0

    APPLICATION__DEBUG=false
    APPLICATION__API_V1_PREFIX=/api/v1
    APPLICATION__PROJECT_NAME=Deribit Price Tracker Test
    APPLICATION__VERSION=1.0.0

    CORS__ORIGINS=["http://localhost:8000"]
    '@ | Out-File -FilePath .env -Encoding UTF8

    Write-Host "=== Created .env file ==="
    Get-Content .env
  - poetry install --with dev

test:
  stage: test
  script:
    - poetry run ruff check .
    - poetry run mypy app/
    - poetry run pytest --cov=app --cov-report=xml --junitxml=pytest.xml -v
  artifacts:
    reports:
      junit: pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

security:
  stage: security
  before_script:
    - |
      cat > .env << 'EOF'
      DATABASE__HOST=localhost
      DATABASE__PORT=5432
      DATABASE__USER=test_user
      DATABASE__PASSWORD=test_password
      DATABASE__DB=test_db
      EOF
  script:
    - pip install bandit
    - bandit -r . -c .bandit.yml -f json -o bandit-report.json
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
    when: always

build:
  stage: build
  only:
    - main
  script:
    - poetry build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
