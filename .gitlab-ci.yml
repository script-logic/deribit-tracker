image: python:3.11

stages:
  - test
  - security
  - build

variables:
  POETRY_VERSION: "1.8.0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python --version
  - pip install poetry==$POETRY_VERSION
  - poetry install --with dev

test:
  stage: test
  script:
    - poetry run ruff check .
    - poetry run mypy app/
    - poetry run pytest --cov=app --cov-report=xml --junitxml=pytest.xml -v
  artifacts:
    reports:
      junit: pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

security:
  stage: security
  script:
    - pip install bandit safety
    - bandit -r . -c .bandit.yml -f json -o bandit-report.json
    - safety check --json > safety-report.json
  artifacts:
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week

build:
  stage: build
  only:
    - main
  script:
    - poetry build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
