[project]
name = "deribit-tracker"
version = "0.1.0"
description = "Deribit Price Tracker API"
readme = "README.md"
requires-python = ">=3.13.3"
license = "MIT"
authors = [
    {name = "script-logic", email = "dev.scriptlogic@gmail.com"}
]
urls = {Repository = "https://github.com/script-logic/deribit-tracker"}
dependencies = [
    "fastapi[standard]>=0.128.0",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.15.0"
ruff = ">=0.4.8"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^7.0.0"
pre-commit = "^4.5.1"
bandit = "^1.9.3"
safety = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 79
format.quote-style = "double"
lint.select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
exclude = ["__pycache__/", ".git/", "*.pyc"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13.3"
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
